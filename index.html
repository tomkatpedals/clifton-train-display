<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Clifton Departures</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
    }

    body {
      background: white;
      color: black;
      font-family: Arial, Helvetica, sans-serif;

      display: flex;
      justify-content: center;
      align-items: center;

      overflow: hidden;
    }

    .display {
      width: calc(100% - 20px);
      height: calc(100% - 20px);

      max-width: 780px;
      max-height: 460px;

      margin: 0;
      padding: 18px 24px;

      border: 1px solid black;

      display: flex;
      flex-direction: column;
    }


    /* =========================
       HEADER
       ========================= */

    .header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;

      padding-bottom: 10px;
      border-bottom: 1px solid black;

      flex-shrink: 0;
    }

    .title {
      font-family: Georgia, "Times New Roman", serif;
      font-size: 34px;
      line-height: 1;
      font-weight: bold;
      letter-spacing: 0.5px;
    }

    .subtitle {
      margin-top: 4px;

      font-size: 13px;
      letter-spacing: 0.5px;
    }

    .destination {
      text-align: right;
    }

    .destination-label {
      font-size: 11px;
      letter-spacing: 1px;
    }

    .destination-name {
      margin-top: 3px;

      font-size: 19px;
      font-weight: bold;
      letter-spacing: 1px;
    }


    /* =========================
       CONTENT
       ========================= */

    #content {
      flex: 1;
      min-height: 0;
    }


    /* =========================
       NEXT TRAIN
       ========================= */

    .next-section {
      padding: 15px 10px 16px 10px;

      border-bottom: 1px solid black;
    }

    .section-label {
      margin-bottom: 8px;

      font-size: 12px;
      letter-spacing: 1px;
    }

    .next-main {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .next-time {
      font-size: 54px;
      line-height: 1;
      font-weight: bold;
    }

    .next-status {
      text-align: right;
    }

    .status-primary {
      font-size: 25px;
      font-weight: bold;
    }

    .status-secondary {
      margin-top: 5px;

      font-size: 16px;
    }


    /* =========================
       UPCOMING TRAINS
       ========================= */

    .upcoming {
      padding-top: 6px;
    }

    .departure-row {
      display: grid;

      grid-template-columns:
        170px
        1fr
        150px;

      column-gap: 12px;

      align-items: center;

      min-height: 54px;

      padding: 5px 10px;

      border-bottom: 1px solid #aaa;
    }

    .departure-row:last-child {
      border-bottom: none;
    }

    .departure-time {
      font-size: 27px;
      font-weight: bold;
    }

    .departure-status {
      text-align: left;

      font-size: 16px;
      font-weight: bold;
    }

    .departure-countdown {
      text-align: right;
      font-size: 17px;
      white-space: nowrap;
      font-weight: bold;
    }


    /* =========================
       FOOTER
       ========================= */

    .footer {
      display: flex;
      justify-content: space-between;

      margin-top: 8px;
      padding-top: 8px;

      border-top: 1px solid black;

      font-size: 11px;
      letter-spacing: 0.6px;

      flex-shrink: 0;
    }


    /* =========================
       EMPTY / ERROR
       ========================= */

    .message {
      padding: 50px 10px;

      text-align: center;

      font-size: 24px;
      font-weight: bold;
    }
  </style>
</head>


<body>

  <div class="display">

    <div class="header">

      <div>
        <div class="title">
          CLIFTON DEPARTURES
        </div>

        <div class="subtitle">
          CLIFTON STATION • NJ TRANSIT
        </div>
      </div>

      <div class="destination">
        <div class="destination-label">
          DIRECTION
        </div>

        <div class="destination-name">
          HOBOKEN
        </div>
      </div>

    </div>


    <div id="content">

      <div class="message">
        Loading departures...
      </div>

    </div>


    <div class="footer">

      <div id="updated">
        UPDATED --
      </div>

      <div>
        REAL-TIME TRAIN STATUS
      </div>

    </div>

  </div>


  <script>

    const TIME_ZONE =
      "America/New_York";


    function convertTo12Hour(timeStr) {

      if (!timeStr) {
        return "--:--";
      }

      const [hour, minute] =
        timeStr.split(":").map(Number);

      const period =
        hour >= 12 ? "PM" : "AM";

      const hour12 =
        hour % 12 || 12;

      return (
        `${hour12}:` +
        `${minute.toString().padStart(2, "0")} ` +
        period
      );
    }


    function getEasternClockParts() {

      const parts =
        new Intl.DateTimeFormat(
          "en-US",
          {
            timeZone: TIME_ZONE,
            hour: "2-digit",
            minute: "2-digit",
            second: "2-digit",
            hour12: false
          }
        )
        .formatToParts(
          new Date()
        );


      function getPart(type) {

        return Number(
          parts.find(
            part =>
              part.type === type
          ).value
        );
      }


      return {
        hour: getPart("hour"),
        minute: getPart("minute"),
        second: getPart("second")
      };
    }


    function minutesUntil(timeStr) {

      if (!timeStr) {
        return null;
      }


      const [hour, minute] =
        timeStr.split(":").map(Number);


      const now =
        getEasternClockParts();


      const nowSeconds =
        (now.hour * 3600) +
        (now.minute * 60) +
        now.second;


      const departureSeconds =
        (hour * 3600) +
        (minute * 60);


      return Math.ceil(
        (
          departureSeconds -
          nowSeconds
        ) / 60
      );
    }


    function cleanStatus(dep) {

  const minutes =
    minutesUntil(
      dep.scheduled_time
    );


  /*
    Once the train is within 2 minutes
    of departure, override "Scheduled"
    and show ALL ABOARD.
  */

  if (
    minutes !== null &&
    minutes <= 2
  ) {
    return "ALL ABOARD";
  }


  let status =
    dep.status || "Scheduled";

  const lower =
    status.toLowerCase();


  if (
    lower.includes("0 min") ||
    lower.includes("0 minutes")
  ) {
    return "ON TIME";
  }


  if (
    lower === "on time"
  ) {
    return "ON TIME";
  }


  if (
    lower.includes("late") ||
    lower.includes("delay")
  ) {
    return status.toUpperCase();
  }


  if (
    lower === "scheduled"
  ) {
    return "SCHEDULED";
  }


  return status.toUpperCase();
}


    function countdownText(minutes) {

      if (minutes === null) {
        return "";
      }


      if (minutes <= 1) {
        return "ALL ABOARD";
      }


      if (minutes >= 60) {

        const hrs =
          Math.floor(
            minutes / 60
          );

        const mins =
          minutes % 60;


        if (mins === 0) {
          return `${hrs} HR`;
        }


        return (
          `${hrs} HR ` +
          `${mins} MIN`
        );
      }


      return `${minutes} MIN`;
    }


    function nextTrainSecondary(dep) {

      const minutes =
        minutesUntil(
          dep.scheduled_time
        );


      if (minutes === null) {
        return "";
      }


      if (minutes <= 1) {
        return "DEPARTING NOW";
      }


      return (
        `DEPARTS IN ` +
        `<strong>${minutes} MINUTES</strong>`
      );
    }


    function renderDepartures(data) {

      const content =
        document.getElementById(
          "content"
        );


      if (
        !Array.isArray(data) ||
        data.length === 0
      ) {

        content.innerHTML = `
          <div class="message">
            No more trains today
          </div>
        `;

        return;
      }


      const next =
        data[0];


      let html = `

        <div class="next-section">

          <div class="section-label">
            NEXT TRAIN
          </div>

          <div class="next-main">

            <div class="next-time">
              ${convertTo12Hour(
                next.scheduled_time
              )}
            </div>

            <div class="next-status">

              <div class="status-primary">
                ${cleanStatus(next)}
              </div>

              <div class="status-secondary">
                ${nextTrainSecondary(next)}
              </div>

            </div>

          </div>

        </div>


        <div class="upcoming">
      `;


      data
        .slice(1, 4)
        .forEach(
          dep => {

            const minutes =
              minutesUntil(
                dep.scheduled_time
              );


            html += `

              <div class="departure-row">

                <div class="departure-time">
                  ${convertTo12Hour(
                    dep.scheduled_time
                  )}
                </div>

                <div class="departure-status">
                  ${cleanStatus(dep)}
                </div>

                <div class="departure-countdown">
                  ${countdownText(
                    minutes
                  )}
                </div>

              </div>
            `;
          }
        );


      html += `
        </div>
      `;


      content.innerHTML =
        html;
    }


    function updateFooterTime() {

      const easternTime =
        new Date()
          .toLocaleTimeString(
            "en-US",
            {
              timeZone: TIME_ZONE,
              hour: "numeric",
              minute: "2-digit",
              hour12: true
            }
          )
          .toUpperCase();


      document.getElementById(
        "updated"
      ).textContent =
        `UPDATED ${easternTime}`;
    }


    async function loadDepartures() {

      try {

        const response =
          await fetch(
            `upcoming_departures.json?t=${Date.now()}`,
            {
              cache: "no-store"
            }
          );


        if (!response.ok) {

          throw new Error(
            `HTTP ${response.status}`
          );
        }


        const data =
          await response.json();


        renderDepartures(
          data
        );


        updateFooterTime();


        console.log(
          "Departures refreshed",
          data
        );

      }

      catch (error) {

        console.error(
          "Departure refresh failed:",
          error
        );


        const content =
          document.getElementById(
            "content"
          );


        if (
          !content.innerHTML.trim()
        ) {

          content.innerHTML = `
            <div class="message">
              Departure data unavailable
            </div>
          `;
        }
      }
    }


    loadDepartures();


    setInterval(
      loadDepartures,
      30000
    );

  </script>

</body>
</html>
